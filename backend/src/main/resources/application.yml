spring:
  application:
    name: stockpulse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockpulse}
    username: ${DB_USERNAME:stockpulse}
    password: ${DB_PASSWORD:stockpulse_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    com.stockpulse: INFO

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  advisor:
    provider: ${ADVISOR_PROVIDER:rule}
    ai:
      timeout-ms: ${ADVISOR_AI_TIMEOUT_MS:1500}
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
